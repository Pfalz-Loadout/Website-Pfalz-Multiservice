  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fspan>\n<\u002Fspan>\n<span class=\"ph ph-b t-stone\">\n<sc-if value=\"{{p.isBar}}\" hint-placeholder-val=\"{{ true }}\"><span class=\"soap tilt\" style=\"background: {{p.tone}}\"><\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{p.isSet}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"soaps3\"><span class=\"soap-s\" style=\"background: {{p.t1}}\"><\u002Fspan><span class=\"soap-s\" style=\"background: {{p.t2}}\"><\u002Fspan><span class=\"soap-s\" style=\"background: {{p.t3}}\"><\u002Fspan><\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{p.isDish}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"dish\"><\u002Fspan><span class=\"soap on-dish\" style=\"background: #E4CB93\"><\u002Fspan><\u002Fsc-if>\n<span class=\"ph-cap\">{{p.capB}}<\u002Fspan>\n<\u002Fspan>\n<\u002Fbutton>\n<div class=\"card-body\">\n<h3 class=\"card-h\"><button class=\"card-name\" sc-camel-on-click=\"{{p.open}}\">{{p.name}}<\u002Fbutton><\u002Fh3>\n<p class=\"card-note\">{{p.note}}<\u002Fp>\n<p class=\"price\"><span>{{p.priceStr}}<\u002Fspan><span class=\"base\">{{p.baseStr}}<\u002Fspan><\u002Fp>\n<button class=\"{{p.addCls}}\" aria-label=\"{{p.addAria}}\" sc-camel-on-click=\"{{p.add}}\">{{p.addLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"padding-top: 0\">\n<div class=\"wrap\">\n<div class=\"sec-head\">\n<div><p class=\"eyebrow\">Zutaten<\u002Fp><h2 class=\"h2\">Was drin ist. Und woher.<\u002Fh2><\u002Fdiv>\n<button class=\"tlink\" sc-camel-on-click=\"{{goZutaten}}\">Alle Zutaten und ihre Herkunft<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<div class=\"ing3\">\n<div class=\"ing\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polygon points=\"14,6 21,10 21,18 14,22 7,18 7,10\"><\u002Fpolygon><polygon points=\"28,6 35,10 35,18 28,22 21,18 21,10\"><\u002Fpolygon><polygon points=\"21,18 28,22 28,30 21,34 14,30 14,22\"><\u002Fpolygon><\u002Fsvg>\n<h3>Honig<\u002Fh3>\n<p>Von einer Imkerei am Haardtrand in Gimmeldingen. Sorgt für einen weichen, cremigen Schaum.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ing\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"17\" r=\"3.6\"><\u002Fcircle><circle cx=\"21.5\" cy=\"17\" r=\"3.6\"><\u002Fcircle><circle cx=\"29\" cy=\"17\" r=\"3.6\"><\u002Fcircle><circle cx=\"17.8\" cy=\"23.6\" r=\"3.6\"><\u002Fcircle><circle cx=\"25.2\" cy=\"23.6\" r=\"3.6\"><\u002Fcircle><circle cx=\"21.5\" cy=\"30.2\" r=\"3.6\"><\u002Fcircle><path d=\"M21.5 13V7\"><\u002Fpath><path d=\"M21.5 9c3-3 7-3 9.5-1-2.5 3-6.5 3-9.5 1z\"><\u002Fpath><\u002Fsvg>\n<h3>Traubenkernöl<\u002Fh3>\n<p>Aus den Kernen Pfälzer Trauben, nach der Lese gepresst. Leicht und schnell einziehend.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ing\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6\" y=\"13\" width=\"28\" height=\"16\" rx=\"2.5\"><\u002Frect><polygon points=\"20,16.5 24,18.8 24,23.2 20,25.5 16,23.2 16,18.8\"><\u002Fpolygon><\u002Fsvg>\n<h3>Bienenwachs<\u002Fh3>\n<p>Vom selben Imker wie der Honig. Macht die Seife fest, damit sie länger hält.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"padding-top: 0\">\n<div class=\"wrap split\">\n<div class=\"ph t-sage split-media\" role=\"img\" aria-label=\"Drei Geschenksets in Naturpapier mit Banderole auf einem Leinentuch\">\n<span class=\"soaps3\"><span class=\"soap-s\" style=\"background: #E4CB93\"><span class=\"band\"><span class=\"stamp\"><\u002Fspan><\u002Fspan><\u002Fspan><span class=\"soap-s\" style=\"background: #C2B8D0\"><span class=\"band\"><span class=\"stamp\"><\u002Fspan><\u002Fspan><\u002Fspan><span class=\"soap-s\" style=\"background: #A97F89\"><span class=\"band\"><span class=\"stamp\"><\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n<span class=\"ph-cap\">G01 · Geschenksets auf Leinen<\u002Fspan>\n<\u002Fdiv>\n<div class=\"split-text\">\n<p class=\"eyebrow\">Geschenke<\u002Fp>\n<h2 class=\"h2\">Geschenke, die benutzt werden.<\u002Fh2>\n<p class=\"muted\">Drei Sets, in Naturpapier eingeschlagen und mit einer Banderole verschlossen. Auf Wunsch legen wir eine Grußkarte mit Ihrem Text bei.<\u002Fp>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{goGeschenke}}\">Zu den Geschenksets<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"padding-top: 0\">\n<div class=\"wrap split rev\">\n<div class=\"ph t-wood split-media\" role=\"img\" aria-label=\"Holzregal in der Werkstatt mit reifenden Seifenstücken\">\n<span class=\"ph-cap\">M03 · Reifende Seifen auf dem Holzregal<\u002Fspan>\n<\u002Fdiv>\n<div class=\"split-text\">\n<p class=\"eyebrow\">Manufaktur<\u002Fp>\n<h2 class=\"h2\">Sechs Wochen Reifezeit.<\u002Fh2>\n<p class=\"muted\">Wir sieden jede Charge von Hand in unserer Werkstatt in Neustadt. Danach lagern die Seifen sechs Wochen auf offenen Holzregalen – erst dann sind sie mild und fest genug für den Versand.<\u002Fp>\n<button class=\"tlink\" sc-camel-on-click=\"{{goManufaktur}}\">So entsteht eine Seife<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"padding-top: 0\">\n<div class=\"wrap\">\n<div class=\"nl\">\n<svg class=\"nl-co gon points=\"21,18 28,22 28,30 21,34 14,30 14,22\"><\u002Fpolygon><\u002Fsvg><span class=\"ph-cap\">Z01 · Honigwabe im Rähmchen<\u002Fspan><\u002Fdiv>\n<div class=\"z-body\">\n<div class=\"z-head\"><span class=\"num\" aria-hidden=\"true\">1<\u002Fspan><h2>Honig<\u002Fh2><\u002Fdiv>\n<p class=\"z-origin\">Imkerei Haardtrand, Gimmeldingen (fiktiv)<\u002Fp>\n<p>Blüten- und Kastanienhonig von Völkern am Rand des Pfälzerwalds. Wir verwenden Honig, der für den Verkauf im Glas zu fest geworden ist – in der Seife ist das kein Nachteil.<\u002Fp>\n<p class=\"z-use\">Enthalten in: Honig &amp; Hafer, Haarseife Honig &amp; Brennnessel<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"z\">\n<div class=\"ph t-wood z-media\" role=\"img\" aria-label=\"Blöcke aus gelbem Bienenwachs auf einem Holzbrett\"><svg class=\"ph-icon\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6\" y=\"13\" width=\"28\" height=\"16\" rx=\"2.5\"><\u002Frect><polygon points=\"20,16.5 24,18.8 24,23.2 20,25.5 16,23.2 16,18.8\"><\u002Fpolygon><\u002Fsvg><span class=\"ph-cap\">Z02 · Bienenwachs auf Holz<\u002Fspan><\u002Fdiv>\n<div class=\"z-body\">\n<div class=\"z-head\"><span class=\"num\" aria-hidden=\"true\">1<\u002Fspan><h2>Bienenwachs<\u002Fh2><\u002Fdiv>\n<p class=\"z-origin\">Imkerei Haardtrand, Gimmeldingen (fiktiv)<\u002Fp>\n<p>Das Wachs fällt beim Entdeckeln der Waben an. Es macht die Seife fester, sodass sie sich langsamer verbraucht.<\u002Fp>\n<p class=\"z-use\">Enthalten in: Lavendel &amp; Bienenwachs<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"z\">\n<div class=\"ph t-stone z-media\" role=\"img\" aria-label=\"Dunkle Weintrauben und Traubenkerne auf einer Schieferplatte\"><svg class=\"ph-icon\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"17\" r=\"3.6\"><\u002Fcircle><circle cx=\"21.5\" cy=\"17\" r=\"3.6\"><\u002Fcircle><circle cx=\"29\" cy=\"17\" r=\"3.6\"><\u002Fcircle><circle cx=\"17.8\" cy=\"23.6\" r=\"3.6\"><\u002Fcircle><circle cx=\"25.2\" cy=\"23.6\" r=\"3.6\"><\u002Fcircle><circle cx=\"21.5\" cy=\"30.2\" r=\"3.6\"><\u002Fcircle><path d=\"M21.5 13V7\"><\u002Fpath><path d=\"M21.5 9c3-3 7-3 9.5-1-2.5 3-6.5 3-9.5 1z\"><\u002Fpath><\u002Fsvg><span class=\"ph-cap\">Z03 · Trauben und Trester auf Schiefer<\u002Fspan><\u002Fdiv>\n<div class=\"z-body\">\n<div class=\"z-head\"><span class=\"num\" aria-hidden=\"true\">2<\u002Fspan><h2>Traubenkernöl &amp; Trester<\u002Fh2><\u002Fdiv>\n<p class=\"z-origin\">Weingut Steinacker, Deidesheim (fiktiv)<\u002Fp>\n<p>Nach der Lese bleibt der Trester übrig: Schalen und Kerne. Die Kerne werden in einer Ölmühle der Region gepresst, den Rest trocknen und vermahlen wir selbst. Das Öl ist leicht, der Trester wirkt als sanftes Peeling.<\u002Fp>\n<p class=\"z-use\">Enthalten in: Traube &amp; Trester, Haarseife Trester &amp; Rosmarin<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"z\">\n<div class=\"ph t-cream z-media\" role=\"img\" aria-label=\"Emaillierte Milchkanne mit frischer Ziegenmilch auf Leinen\"><svg class=\"ph-icon\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6c5 7 9 12 9 17a9 9 0 0 1-18 0c0-5 4-10 9-17z\"><\u002Fpath><\u002Fsvg><span class=\"ph-cap\">Z04 · Ziegenmilch in der Kanne<\u002Fspan><\u002Fdiv>\n<div class=\"z-body\">\n<div class=\"z-head\"><span class=\"num\" aria-hidden=\"true\">3<\u002Fspan><h2>Ziegenmilch<\u002Fh2><\u002Fdiv>\n<p class=\"z-origin\">Ziegenhof am Kalmit, Maikammer (fiktiv)<\u002Fp>\n<p>Frische Milch, die wir am Vortag des Siedens abholen und einfrieren. So bleibt sie hell und riecht nicht.<\u002Fp>\n<p class=\"z-use\">Enthalten in: Ziegenmilch pur<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"z\">\n<div class=\"ph t-sage z-media\" role=\"img\" aria-label=\"Gebündelter, getrockneter Lavendel auf einem Holztisch\"><svg class=\"ph-icon\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M20 35V13\"><\u002Fpath><ellipse cx=\"20\" cy=\"9\" rx=\"2\" ry=\"3\"><\u002Fellipse><ellipse cx=\"17\" cy=\"13.5\" rx=\"2\" ry=\"3\" transform=\"rotate(-20 17 13.5)\"><\u002Fellipse><ellipse cx=\"23\" cy=\"13.5\" rx=\"2\" ry=\"3\" transform=\"rotate(20 23 13.5)\"><\u002Fellipse><ellipse cx=\"17\" cy=\"19\" rx=\"2\" ry=\"3\" transform=\"rotate(-20 17 19)\"><\u002Fellipse><ellipse cx=\"23\" cy=\"19\" rx=\"2\" ry=\"3\" transform=\"rotate(20 23 19)\"><\u002Fellipse><\u002Fsvg><span class=\"ph-cap\">Z05 · Lavendel, gebündelt<\u002Fspan><\u002Fdiv>\n<div class=\"z-body\">\n<div class=\"z-head\"><span class=\"num\" aria-hidden=\"true\">4<\u002Fspan><h2>Lavendel<\u002Fh2><\u002Fdiv>\n<p class=\"z-origin\">Lavendel vom Sonnenberg, Edenkoben (fiktiv)<\u002Fp>\n<p>Ein kleines Feld an einem Südhang. Wir beziehen das ätherische Öl und getrocknete Blüten aus derselben Ernte.<\u002Fp>\n<p class=\"z-use\">Enthalten in: Lavendel &amp; Bienenwachs<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"z\">\n<div class=\"ph t-sage z-media\" role=\"img\" aria-label=\"Frische Zweige Rosmarin und Thymian auf einem Schneidebrett\"><svg class=\"ph-icon\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 33C15 25 21 15 30 8\"><\u002Fpath><path d=\"M15 26c-4-1-6-4-6-7 4 0 6 3 6 7z\"><\u002Fpath><path d=\"M20 18c-4-1-6-4-6-7 4 0 6 3 6 7z\"><\u002Fpath><path d=\"M19 24c4 0 7-2 8-6-4 0-7 2-8 6z\"><\u002Fpath><path d=\"M24 16c4 0 7-2 8-6-4 0-7 2-8 6z\"><\u002Fpath><\u002Fsvg><span class=\"ph-cap\">Z06 · Rosmarin und Thymian<\u002Fspan><\u002Fdiv>\n<div class=\"z-body\">\n<div class=\"z-head\"><span class=\"num\" aria-hidden=\"true\" style=\"background: #C08A2D; color: #3A2A1D\">M<\u002Fspan><h2>Kräuter<\u002Fh2><\u002Fdiv>\n<p class=\"z-origin\">Garten der Manufaktur, Neustadt an der Weinstraße<\u002Fp>\n<p>Rosmarin und Thymian wachsen hinter unserer Werkstatt. Wir setzen sie mehrere Wochen in Olivenöl an.<\u002Fp>\n<p class=\"z-use\">Enthalten in: Kräutergarten, Haarseife Trester &amp; Rosmarin<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"z\" style=\"padding-bottom: 0\">\n<div><\u002Fdiv>\n<div class=\"z-body\">\n<h2 style=\"font-size: 26px\">Und außerdem<\u002Fh2>\n<p class=\"muted\">Olivenöl, Kokosöl, Rapsöl, Rizinusöl und Sheabutter bilden die Grundlage jeder Seife. Diese Rohstoffe wachsen nicht in der Pfalz; wir beziehen sie von einem Großhändler für Naturkosmetik-Rohstoffe.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MANUFAKTUR ============ -->\n<sc-if value=\"{{isManufaktur}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"pg\">\n<div class=\"wrap\">\n<header class=\"phead\">\n<p class=\"eyebrow\">Manufaktur<\u002Fp>\n<h1>Eine Werkstatt in Neustadt.<\u002Fh1>\n<p class=\"lead\">Honigstück ist eine kleine Seifenmanufaktur in Neustadt an der Weinstraße. Jede Seife entsteht hier – vom Abwiegen der Öle bis zur Banderole.<\u002Fp>\n<\u002Fheader>\n<\u002Fdiv>\n<section class=\"wrap split\" style=\"padding-bottom: 96px\">\n<div class=\"ph t-wood split-media\" role=\"img\" aria-label=\"Hände der Gründerin an der Werkbank, ein Seifenblock wird geprüft\"><span class=\"ph-cap\">M05 · Hände an der Werkbank<\u002Fspan><\u002Fdiv>\n<div class=\"split-text\">\n<p class=\"eyebrow\">Die Gründerin<\u002Fp>\n<h2 class=\"h2\">[Name der Gründerin]<\u002Fh2>\n<p class=\"muted\">[Platzhalter: Zwei bis drei Sätze zur Geschichte – was sie vorher gemacht hat, wie die erste Seife entstanden ist und warum sie mit Zutaten aus der Pfalz arbeitet.]<\u002Fp>\n<p class=\"muted\">[Platzhalter: ein Satz zur Werkstatt heute, zum Beispiel seit wann es sie gibt und wie viele Menschen mitarbeiten.]<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"wrap\" style=\"padding-bottom: 96px\">\n<div class=\"sec-head\"><div><p class=\"eyebrow\">Herstellung<\u002Fp><h2 class=\"h2\">In vier Schritten zur fertigen Seife<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<ol class=\"steps\">\n<li class=\"step\"><span class=\"step-n\" aria-hidden=\"true\">01<\u002Fspan><h3>Sieden<\u002Fh3><p>Öle, Fette und Lauge werden bei niedriger Temperatur verrührt. Honig, Milch oder Trester kommen erst zum Schluss dazu.<\u002Fp><\u002Fli>\n<li class=\"step\"><span class=\"step-n\" aria-hidden=\"true\">02<\u002Fspan><h3>Gießen<\u002Fh3><p>Die Masse wird in Holzformen gegossen und ruht 24 bis 48 Stunden, bis sie schnittfest ist.<\u002Fp><\u002Fli>\n<li class=\"step\"><span class=\"step-n\" aria-hidden=\"true\">03<\u002Fspan><h3>Reifen · 6 Wochen<\u002Fh3><p>Auf offenen Holzregalen verdunstet überschüssiges Wasser. Die Seife wird fester, milder und hält länger.<\u002Fp><\u002Fli>\n<li class=\"step\"><span class=\"step-n\" aria-hidden=\"true\">04<\u002Fspan><h3>Schneiden &amp; Verpacken<\u002Fh3><p>Wir schneiden jedes Stück von Hand, wiegen es und schlagen es in eine Banderole aus Naturpapier ein.<\u002Fp><\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n<section class=\"wrap\" style=\"padding-bottom: 96px\">\n<div class=\"sec-head\"><div><p class=\"eyebrow\">Aus der Werkstatt<\u002Fp><h2 class=\"h2\">Einblicke<\u002Fh2><\u002Fdiv><\u002Fdiv>\n<div class=\"mgrid\">\n<div class=\"ph t-stone\" role=\"img\" aria-label=\"Hände schneiden einen Seifenblock mit einem Drahtschneider\"><span class=\"ph-cap\">M01 · Schneiden von Hand<\u002Fspan><\u002Fdiv>\n<div class=\"ph t-wood\" role=\"img\" aria-label=\"Flüssige Seifenmasse wird in eine Holzform gegossen\"><span class=\"ph-cap\">M02 · Gießen in die Holzform<\u002Fspan><\u002Fdiv>\n<div class=\"ph t-wax\" role=\"img\" aria-label=\"Holzregal mit reifenden Seifenstücken\"><span class=\"ph-cap\">M03 · Reiferegal<\u002Fspan><\u002Fdiv>\n<div class=\"ph t-cream\" role=\"img\" aria-label=\"Hände legen eine Papierbanderole um ein Seifenstück\"><span class=\"ph-cap\">M04 · Banderole anlegen<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"wrap\" style=\"padding-bottom: 104px\">\n<div class=\"callout\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 34em\">\n<h2 class=\"h3\">Abholung nach Vereinbarung<\u002Fh2>\n<p class=\"muted\">Sie wohnen in der Nähe? Holen Sie Ihre Bestellung in der Werkstatt ab. Bitte melden Sie sich vorher kurz.<\u002Fp>\n<\u002Fdiv>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{goKontakt}}\">Kontakt aufnehmen<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ KONTAKT ============ -->\n<sc-if value=\"{{isKontakt}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"pg wrap\">\n<header class=\"phead\">\n<p class=\"eyebrow\">Kontakt<\u002Fp>\n<h1>Schreiben Sie uns.<\u002Fh1>\n<p class=\"lead\">Fragen zu Zutaten, Bestellungen oder Geschenken beantworten wir in der Regel innerhalb von zwei Werktagen.<\u002Fp>\n<\u002Fheader>\n<div class=\"kt\">\n<div>\n<sc-if value=\"{{contactOpen}}\" hint-placeholder-val=\"{{ true }}\">\n<form class=\"form\" sc-camel-on-submit=\"{{submitContact}}\">\n<div class=\"row2\">\n<div class=\"fld\"><label for=\"hs-name\">Name<\u002Flabel><input id=\"hs-name\" class=\"box-inp\" type=\"text\" sc-camel-auto-complete=\"name\" required=\"{{ true }}\"><\u002Fdiv>\n<div class=\"fld\"><label for=\"hs-mail\">E-Mail<\u002Flabel><input id=\"hs-mail\" class=\"box-inp\" type=\"email\" sc-camel-auto-complete=\"email\" required=\"{{ true }}\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"fld\"><label for=\"hs-topic\">Anliegen<\u002Flabel>\n<sc-raw-select id=\"hs-topic\" class=\"box-inp\" style=\"cursor: pointer\">\n<option>Allgemeine Frage<\u002Foption>\n<option>Frage zu einer Bestellung<\u002Foption>\n<option>Geschenk oder größere Menge<\u002Foption>
