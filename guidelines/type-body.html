<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px;max-width:600px"><p style="margin:0;font:400 20px/1.5 var(--font-body);color:var(--text-strong)">Wir transportieren, lagern und organisieren – zuverlässig, termingerecht und aus einer Hand.</p><p style="margin:0;font:var(--type-body)">Von der Kurierfahrt bis zum sicheren Lagerraum: Wir planen jeden Auftrag so, dass er bei Ihnen einfach funktioniert.</p><p style="margin:0;font:400 13px var(--font-body);color:var(--text-subtle)">Caption · Poppins 13px · Steel 500</p></div></body></html>
