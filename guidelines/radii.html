<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div style="height:70px;background:var(--surface-tint);border:1.5px solid var(--brand-primary);border-radius:0"></div><div class="lbl">0 · Images full-bleed</div></div><div class="sw"><div style="height:70px;background:var(--surface-tint);border:1.5px solid var(--brand-primary);border-radius:2px"></div><div class="lbl">xs · Chips</div></div><div class="sw"><div style="height:70px;background:var(--surface-tint);border:1.5px solid var(--brand-primary);border-radius:4px"></div><div class="lbl">sm · Buttons, inputs</div></div><div class="sw"><div style="height:70px;background:var(--surface-tint);border:1.5px solid var(--brand-primary);border-radius:6px"></div><div class="lbl">md · Cards</div></div><div class="sw"><div style="height:70px;background:var(--surface-tint);border:1.5px solid var(--brand-primary);border-radius:10px"></div><div class="lbl">lg · Modals</div></div></div></body></html>
