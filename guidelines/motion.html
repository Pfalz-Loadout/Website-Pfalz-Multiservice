<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw" style="background:var(--surface-alt);padding:14px;border-radius:6px"><div class="lbl">150ms</div><div class="val">--dur-fast</div><div style="font-size:13px">Hover color</div></div><div class="sw" style="background:var(--surface-alt);padding:14px;border-radius:6px"><div class="lbl">250ms</div><div class="val">--dur-base</div><div style="font-size:13px">Lift, accordion</div></div><div class="sw" style="background:var(--surface-alt);padding:14px;border-radius:6px"><div class="lbl">500ms</div><div class="val">--dur-slow</div><div style="font-size:13px">Image zoom, reveal</div></div></div><div class="val" style="margin-top:10px">--ease-out cubic-bezier(.22,.61,.36,1)</div></body></html>
