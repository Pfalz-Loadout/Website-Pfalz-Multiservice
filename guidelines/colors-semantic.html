<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--pm-success);"></div><div class="lbl">Erfolg</div><div class="val">#2F9E6B</div></div><div class="sw"><div class="chip" style="background:var(--pm-warning);"></div><div class="lbl">Hinweis</div><div class="val">#F2A53A</div></div><div class="sw"><div class="chip" style="background:var(--pm-danger);"></div><div class="lbl">Fehler</div><div class="val">#D64545</div></div><div class="sw"><div class="chip" style="background:var(--pm-info);"></div><div class="lbl">Info</div><div class="val">#2E9BFF</div></div></div></body></html>
