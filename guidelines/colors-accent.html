<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--pm-ink-1000);border:1px solid var(--border-strong)"></div><div class="lbl">Ink 1000 · Page</div><div class="val">#000000</div></div><div class="sw"><div class="chip" style="background:var(--pm-ink-950);border:1px solid var(--border-strong)"></div><div class="lbl">Ink 950</div><div class="val">#0A0A0A</div></div><div class="sw"><div class="chip" style="background:var(--pm-ink-900);border:1px solid var(--border-strong)"></div><div class="lbl">Ink 900 · Card</div><div class="val">#121212</div></div><div class="sw"><div class="chip" style="background:var(--pm-ink-850);border:1px solid var(--border-strong)"></div><div class="lbl">Ink 850 · Border</div><div class="val">#191919</div></div><div class="sw"><div class="chip" style="background:var(--pm-ink-800);"></div><div class="lbl">Ink 800</div><div class="val">#1F1F1F</div></div><div class="sw"><div class="chip" style="background:var(--pm-ink-700);"></div><div class="lbl">Ink 700</div><div class="val">#2A2A2A</div></div><div class="sw"><div class="chip" style="background:var(--pm-ink-600);"></div><div class="lbl">Ink 600</div><div class="val">#3A3A3A</div></div></div></body></html>
