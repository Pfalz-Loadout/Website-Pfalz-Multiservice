<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row" style="padding:10px 0"><div class="sw"><div style="height:80px;background:#fff;border-radius:6px;box-shadow:var(--shadow-xs)"></div><div class="lbl">xs</div></div><div class="sw"><div style="height:80px;background:#fff;border-radius:6px;box-shadow:var(--shadow-sm)"></div><div class="lbl">sm</div></div><div class="sw"><div style="height:80px;background:#fff;border-radius:6px;box-shadow:var(--shadow-md)"></div><div class="lbl">md · card hover</div></div><div class="sw"><div style="height:80px;background:#fff;border-radius:6px;box-shadow:var(--shadow-lg)"></div><div class="lbl">lg · floating</div></div><div class="sw"><div style="height:80px;background:#fff;border-radius:6px;box-shadow:var(--shadow-glow)"></div><div class="lbl">glow · focus</div></div></div></body></html>
