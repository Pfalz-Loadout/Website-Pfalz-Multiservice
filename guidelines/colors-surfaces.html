<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces" subtitle="Light / alt / dark section rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div style="flex:1;height:130px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-page);padding:14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:700 13px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--text-strong)">Page</span><span class="val" style="color:">--surface-page</span></div><div style="flex:1;height:130px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-alt);padding:14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:700 13px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--text-strong)">Alt</span><span class="val" style="color:">--surface-alt</span></div><div style="flex:1;height:130px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-tint);padding:14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:700 13px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--text-strong)">Tint</span><span class="val" style="color:">--surface-tint</span></div><div style="flex:1;height:130px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-dark);padding:14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:700 13px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:#fff">Dark</span><span class="val" style="color:var(--text-on-dark-muted)">--surface-dark</span></div><div style="flex:1;height:130px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-darker);padding:14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:700 13px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:#fff">Darker</span><span class="val" style="color:var(--text-on-dark-muted)">--surface-darker</span></div></div></body></html>
