<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--text-body);background:#000;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font:600 12px var(--font-display);color:var(--text-strong)}.val{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="border:1px dashed var(--border-strong);padding:16px;border-radius:4px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="height:80px;background:var(--surface-tint);border-radius:4px;display:flex;align-items:center;justify-content:center" class="val">col 1</div><div style="height:80px;background:var(--surface-tint);border-radius:4px;display:flex;align-items:center;justify-content:center" class="val">col 2</div><div style="height:80px;background:var(--surface-tint);border-radius:4px;display:flex;align-items:center;justify-content:center" class="val">col 3</div><div style="height:80px;background:var(--surface-tint);border-radius:4px;display:flex;align-items:center;justify-content:center" class="val">col 4</div></div></div><div class="val" style="margin-top:10px">--container-max 1240px · --grid-gap 28px · --section-y 72–112px · --card-pad 28px</div></body></html>
